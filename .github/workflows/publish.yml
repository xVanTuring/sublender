name: Pack Addon

on:
  push:
    branches: [ "dev" ]


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11" ]
    name: "OS ${{ matrix.os }} Python ${{ matrix.python-version }}"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pack Addon
        run: python ./scripts/release.py

      - name: Get file name
        run: |
          echo "FILEPATH=$(Get-ChildItem ./dist/)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "BASENAME=$($(Get-ChildItem ./dist/).BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: unzip for artifact
        run: Expand-Archive ${{ env.FILEPATH }} -DestinationPath ./dist/
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASENAME }}
          path: ./dist/sublender


